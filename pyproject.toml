[project]
name = "meraki-switch-migrator"
version = "0.1.0"
description = "Local, audited migration assistant for Cisco Meraki MS switches"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
windows = ["pywin32>=306"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[project.scripts]
meraki-switch-migrator = "app.main:run"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

